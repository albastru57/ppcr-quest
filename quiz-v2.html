<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPCR Quest v2</title>
<style>body{margin:0;background:#f5f7fb;font-family:Arial,Tahoma,sans-serif;color:#172033}.wrap{max-width:760px;margin:auto;padding:16px}.hero{background:#3157d5;color:#fff;padding:22px;border-radius:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-top:16px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.topic{background:#eef2ff;color:#2439a8;padding:6px 10px;border-radius:999px;font-size:13px}.progress{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#3157d5;width:0}.q{font-size:20px;line-height:1.6}.sub{color:#6b7280;margin:6px 0 12px}.answers{display:grid;gap:10px}.choice{width:100%;text-align:right;background:#fff;border:1px solid #dfe3ea;border-radius:12px;padding:13px;font-size:16px}.correct{background:#eefbf2!important;border-color:#86d19c!important}.wrong{background:#fff1f1!important;border-color:#ef9a9a!important}.feedback{display:none;margin-top:14px;padding:14px;border-radius:12px;line-height:1.7}.ok{display:block;background:#eefbf2}.bad{display:block;background:#fff4f4}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:700;margin-top:12px}.primary{background:#3157d5;color:#fff}.secondary{background:#eef1f6}.hidden{display:none!important}.score{text-align:center;font-size:48px;font-weight:800;color:#3157d5}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #e5e7eb;text-align:right}.good{color:#15803d}.weak{color:#b91c1c}</style></head>
<body><div class="wrap"><div class="hero"><h1>PPCR Quest 🧪</h1><p>50 سؤالًا — ترتيب الأسئلة والخيارات يتغيّر في كل محاولة.</p></div>
<div id="startCard" class="card"><h2>ابدأ الاختبار</h2><input id="nameInput" placeholder="الاسم" style="width:95%;padding:13px;border:1px solid #dfe3ea;border-radius:12px;font-size:16px"><br><button id="startBtn" class="btn primary">ابدأ</button></div>
<div id="quiz" class="card hidden"><div class="top"><div id="count"></div><div id="topic" class="topic"></div></div><div class="progress"><div id="bar" class="bar"></div></div><div id="q" class="q"></div><div id="sub" class="sub"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><button id="next" class="btn primary hidden">التالي</button></div>
<div id="result" class="card hidden"><div>النتيجة النهائية</div><div id="score" class="score"></div><div id="grade"></div><div id="summary"></div><button id="retry" class="btn primary">إعادة الاختبار</button><button id="review" class="btn secondary">مراجعة الأخطاء فقط</button><button id="share" class="btn primary">مشاركة النتيجة</button><button id="whatsapp" class="btn secondary">إرسال عبر واتساب</button></div></div>
<script>
const Q=[
["Data Types","Which of the following is a continuous variable?","اختر المتغير الرقمي المستمر.",["Sex","Treatment group","Blood pressure","Smoking status"],2,"ضغط الدم قيمة رقمية قابلة للقياس، لذلك هو Continuous variable."],
["Plots","You want to visualize the distribution of patients' ages. Which plot is most appropriate?","أعمار المرضى = متغير رقمي واحد.",["Bar chart","Histogram","Pie chart","Scatter plot"],1,"Histogram يُستخدم لعرض Distribution لمتغير رقمي مستمر واحد."],
["Plots","Which plot is best for comparing blood pressure between Drug A and Drug B and spotting potential outliers?","مقارنة قيمة رقمية بين مجموعتين.",["Boxplot","Pie chart","Line plot","Bar chart"],0,"Boxplot ممتاز للمقارنة بين المجموعات ويعرض Median وPotential outliers."],
["Plots","Which plot is used to visualize the relationship between age and blood pressure?","متغيران رقميان.",["Scatter plot","Histogram","Pie chart","Bar chart"],0,"Scatter plot يُستخدم للعلاقة بين متغيرين Continuous."],
["Plots","You want to compare the number of patients in Drug A, Drug B, and Drug C. Which plot?","هذه Categories.",["Histogram","Bar chart","Q-Q plot","Density plot"],1,"Bar chart مناسب للفئات والأعداد أو النسب."],
["Plots","Which plot is most appropriate to show how IOP changes from baseline to week 12?","تغير عبر الزمن.",["Line plot","Pie chart","Histogram","Boxplot"],0,"Line plot يعرض Trend أو Change over time."],
["Normality","How would you visually check the normality assumption?","سؤال امتحاني مهم.",["Only by the mean","Inspect the histogram and Q-Q plot","Use a bar chart","Use Fisher's exact test"],1,"افحص Histogram وQ-Q plot. إذا كانت النقاط تتبع الخط تقريبًا فـ normality assumption reasonable."],
["Normality","In a Q-Q plot, points approximately following the reference line suggest:","فحص بصري.",["Strong non-normality","Approximately normal distribution","Equal variances","Categorical outcome"],1,"النقاط القريبة تقريبًا من الخط تدعم Normality."],
["Normality","Shapiro-Wilk test is primarily used to assess:","ما الذي يفحصه؟",["Equal variances","Normality","Correlation","Categorical independence"],1,"Shapiro-Wilk يفحص Normality."],
["Normality","Shapiro-Wilk gives p = 0.20. At α = 0.05, the best interpretation is:","لا تقل Normal 100%.",["Strong evidence against normality","Normality assumption is not rejected","Variances are equal","Means are equal"],1,"لأن p>0.05 لا نرفض H₀ الخاصة بالطبيعية."],
["Normality","Shapiro-Wilk gives p = 0.01. What does this suggest?","p أصغر من 0.05.",["Evidence against normality","Proof data are normal","Equal variances","No relationship"],0,"p<0.05 يعطي دليلًا ضد Normality."],
["Assumptions","Levene's test is used to assess:","ما الذي يفحصه؟",["Normality","Equal variances","Median difference","Correlation"],1,"Levene's test يفحص Equality/Homogeneity of variances."],
["Assumptions","Levene's test gives p = 0.32. Best interpretation?","H₀ هنا تخص التباينات.",["Variances clearly differ","Equal variance assumption is not rejected","Data definitely normal","Means are equal"],1,"p>0.05: لا يوجد دليل كافٍ على اختلاف التباينات."],
["Groups","Drug A is given to 50 patients and Drug B to 50 different patients. These groups are:","أشخاص مختلفون.",["Paired","Independent","Binary","Repeated measures"],1,"Different people → Independent groups."],
["Groups","Blood pressure is measured in the same patients before and after treatment. These measurements are:","نفس الأشخاص مرتين.",["Independent","Paired","Categorical","Unrelated"],1,"Same people measured twice → Paired."],
["Statistical Tests","One group is compared with a reference value. Which parametric test is appropriate?","مجموعة مقابل قيمة ثابتة.",["One-sample t-test","Paired t-test","ANOVA","Chi-square"],0,"One group vs reference → One-sample t-test."],
["Statistical Tests","Two independent groups with a continuous outcome are compared. Which parametric test?","Drug A vs Drug B.",["Paired t-test","Independent / two-sample t-test","ANOVA","Fisher's exact"],1,"2 independent groups → Independent t-test."],
["Statistical Tests","Common non-parametric alternative to the independent t-test?","بديل لمجموعتين مستقلتين.",["Wilcoxon signed-rank","Mann–Whitney U","Kruskal–Wallis","Pearson"],1,"2 independent groups → Mann–Whitney U."],
["Statistical Tests","The same patients are measured before and after treatment. Which parametric test?","نفس الأشخاص.",["Independent t-test","Paired t-test","ANOVA","Chi-square"],1,"Paired measurements → Paired t-test."],
["Statistical Tests","Common non-parametric alternative to the paired t-test?","قياسات مرتبطة.",["Mann–Whitney U","Wilcoxon signed-rank","Kruskal–Wallis","Fisher's exact"],1,"Paired → Wilcoxon signed-rank."],
["Statistical Tests","Compare mean blood pressure across Drug A, Drug B, and Drug C. Which parametric test?","3+ مجموعات مستقلة.",["ANOVA","Paired t-test","Chi-square","One-sample t-test"],0,"3+ independent groups → ANOVA."],
["Statistical Tests","Common non-parametric alternative to one-way ANOVA for 3+ independent groups?","بديل غير معلمي.",["Kruskal–Wallis","Mann–Whitney U","Wilcoxon signed-rank","Pearson"],0,"3+ independent groups → Kruskal–Wallis."],
["Correlation","Which test is used for a linear relationship between two continuous variables when assumptions are appropriate?","Age وBlood Pressure.",["Pearson correlation","Chi-square","ANOVA","Fisher's exact"],0,"Pearson يقيس الارتباط الخطي بين متغيرين رقميين."],
["Correlation","What is a common rank-based alternative to Pearson correlation?","بديل شائع.",["Spearman correlation","Levene's test","ANOVA","One-sample t-test"],0,"Spearman يعتمد على الرتب."],
["Categorical","Association between treatment group (A/B) and recovery (Yes/No). Which test is usually considered?","Categorical × Categorical.",["Chi-square","Paired t-test","Pearson","ANOVA"],0,"Categorical × categorical → Chi-square عادةً."],
["Categorical","If expected cell counts are very small in a 2×2 table, which test may be preferred?","خلايا صغيرة.",["Fisher's exact","ANOVA","Shapiro-Wilk","Paired t-test"],0,"Fisher's exact مناسب عندما تكون expected cell counts صغيرة."],
["Regression","Which method is commonly used when the outcome is binary (Yes/No) and there are predictors?","مثال: Disease Yes/No + age + smoking.",["Logistic regression","Linear correlation only","Histogram","Levene's test"],0,"Binary outcome + predictors → Logistic regression."],
["p-value & H₀","At α = 0.05, p < 0.05 generally means:","التفسير العام.",["Evidence against the null hypothesis","H₀ is proven true","Effect is always clinically important","Data are always normal"],0,"p<0.05 تعني evidence against H₀ عند α=0.05."],
["p-value & H₀","For an independent t-test, the usual null hypothesis is:","H₀ في t-test.",["The group means are equal","Variables are categorical","Data are normal","Variances are unequal"],0,"H₀: population means are equal."],
["p-value & H₀","For a chi-square test of independence, the null hypothesis is:","H₀ هنا.",["The categorical variables are independent","All means are equal","Correlation = 1","Data are normal"],0,"H₀: المتغيران الفئويان مستقلان."],
["p-value & H₀","Why is it wrong to memorize 'p > 0.05 = good' and 'p < 0.05 = bad'?","فكرة أساسية.",["Every test has a different null hypothesis","p-values are never used","0.05 is always wrong","All tests have identical hypotheses"],0,"معنى p-value يعتمد على الاختبار وعلى Null hypothesis الخاصة به."],
["Effect Size","Control risk is 10% and treatment risk is 5%. What is the ARR?","Absolute Risk Reduction.",["5 percentage points","50%","10%","20%"],0,"ARR = 10% − 5% = 5 percentage points."],
["Effect Size","Control risk is 10% and treatment risk is 5%. What is the RRR?","Relative Risk Reduction.",["5%","50%","10%","20%"],1,"RRR = (10−5)/10 = 50%."],
["Effect Size","If ARR = 5% (0.05), what is the NNT?","NNT = 1 / ARR.",["5","10","20","50"],2,"NNT = 1/0.05 = 20."],
["Effect Size","What does NNT = 23 mean?","التفسير السريري.",["Treat 23 patients for one additional beneficial outcome vs control","23% will benefit","23 will definitely be cured","No effect"],0,"NNT=23 يعني علاج 23 مريضًا لتحقيق فائدة إضافية واحدة مقارنة بالـcontrol."],
["Effect Size","Cohen's d is mainly used to describe:","ماذا يقيس؟",["Standardized difference between two means","ARR","NNT","Normality"],0,"Cohen's d يقيس حجم الفرق المعياري بين متوسطين."],
["Effect Size","Using the common rule of thumb, Cohen's d = 0.8 suggests:","قاعدة تقريبية.",["Small effect","Medium effect","Large effect","No effect"],2,"تقريبًا: 0.2 small، 0.5 medium، 0.8 large."],
["Plots","Which plot is best for displaying proportions of a whole, such as 60% female and 40% male?","نسب من مجموع 100%.",["Pie chart","Histogram","Scatter plot","Q-Q plot"],0,"Pie chart يعرض Proportions of a whole."],
["Plots","Which plot gives a smooth view of the distribution of a continuous variable?","يشبه Histogram لكن بمنحنى ناعم.",["Density plot","Bar chart","Pie chart","Line plot"],0,"Density plot يعرض شكل التوزيع باستخدام منحنى ناعم."],
["Plots","Which plot is especially useful for showing the median and potential outliers?","Median + Outliers.",["Boxplot","Scatter plot","Line plot","Pie chart"],0,"Boxplot يوضح Median وQuartiles وPotential outliers."],
["Assumptions","Which of the following is a visual, not p-value based, check of normality?","فحص بصري.",["Q-Q plot","Shapiro-Wilk test","Levene's test","Chi-square"],0,"Q-Q plot فحص بصري ولا يعطي p-value."],
["Assumptions","A histogram is strongly right-skewed. What does this suggest?","Skewness واضح.",["Possible non-normality","Equal variances","Perfect normality","Categorical data"],0,"الـskewness الواضح قد يشير إلى أن التوزيع ليس طبيعيًا تقريبًا."],
["Statistical Tests","One group is compared with a reference value, but a non-parametric alternative is needed. Which test?","One group vs reference.",["Wilcoxon signed-rank","Mann–Whitney U","Kruskal–Wallis","Fisher's exact"],0,"One group vs reference → Wilcoxon signed-rank كبديل غير معلمي شائع."],
["p-value & H₀","For ANOVA, the null hypothesis is usually:","H₀ في ANOVA.",["All group means are equal","All medians are zero","Variables are independent","Data are always normal"],0,"في ANOVA: H₀ تقول إن جميع متوسطات المجموعات متساوية."],
["p-value & H₀","For Pearson correlation, the usual null hypothesis is:","H₀ في Pearson.",["Population linear correlation equals 0","Means are equal","Variances are equal","Data are categorical"],0,"Pearson: H₀ عادةً أن الارتباط الخطي السكاني يساوي صفر."],
["Effect Size","Which measure tells you how much the risk decreased in absolute terms?","انخفاض فعلي مباشر.",["ARR","RRR","Cohen's d","Pearson r"],0,"ARR = Absolute Risk Reduction، أي الانخفاض المطلق في الخطر."],
["Effect Size","Which measure expresses the reduction relative to the original control risk?","مقارنة بالخطر الأصلي.",["RRR","ARR","NNT","Cohen's d"],0,"RRR يقيس الانخفاض نسبةً إلى الخطر الأصلي."],
["Effect Size","In general, for the same outcome and follow-up time, a smaller NNT suggests:","نفس الـoutcome ونفس الزمن.",["Greater absolute treatment benefit","No treatment effect","More non-normality","Smaller sample size"],0,"بشكل عام NNT أصغر يعني فائدة علاجية مطلقة أكبر، مع ضرورة النظر للسياق السريري."],
["Effect Size","Cohen's d = 0.2 is commonly interpreted as:","قاعدة تقريبية.",["Small effect","Medium effect","Large effect","No effect"],0,"القاعدة التقريبية: d=0.2 small effect."],
["Decision Strategy","What is the best first step when choosing a statistical test?","الجملة الذهبية.",["Identify the outcome type","Always run ANOVA","Look only at p-value","Use Chi-square for everything"],0,"ابدأ بتحديد نوع Outcome، ثم عدد المجموعات وهل هي independent أو paired، ثم افحص assumptions."]];
let order=[],pos=0,score=0,wrong=[],stats={},answered=false,participantName="Student";const E=id=>document.getElementById(id),pct=(a,b)=>b?Math.round(100*a/b):0;const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function render(){answered=false;const x=Q[order[pos]];E("count").textContent=`السؤال ${pos+1} من ${order.length}`;E("topic").textContent=x[0];E("bar").style.width=`${100*pos/order.length}%`;E("q").textContent=x[1];E("sub").textContent=x[2];E("answers").innerHTML="";E("feedback").className="feedback";E("feedback").innerHTML="";E("next").classList.add("hidden");shuffle(x[3].map((t,i)=>({t,i}))).forEach(o=>{let b=document.createElement("button");b.className="choice";b.textContent=o.t;b.onclick=()=>choose(o.i,b);E("answers").appendChild(b)})}
function choose(i,b){if(answered)return;answered=true;const qi=order[pos],x=Q[qi],bs=[...document.querySelectorAll(".choice")];stats[x[0]]??={r:0,t:0};stats[x[0]].t++;if(i===x[4]){score++;stats[x[0]].r++;b.classList.add("correct");E("feedback").className="feedback ok";E("feedback").innerHTML=`✅ <b>صحيح</b><br>${x[5]}`}else{wrong.push(qi);b.classList.add("wrong");bs.find(z=>z.textContent===x[3][x[4]])?.classList.add("correct");E("feedback").className="feedback bad";E("feedback").innerHTML=`❌ <b>تحتاج مراجعة</b><br>${x[5]}`}bs.forEach(z=>z.disabled=true);E("next").classList.remove("hidden")}
E("next").onclick=()=>{pos++;pos<order.length?render():finish()};function finish(){E("quiz").classList.add("hidden");E("result").classList.remove("hidden");let p=pct(score,order.length);E("score").textContent=p+"%";E("grade").textContent=participantName+" — "+(p>=90?"ممتاز جدًا 🏆":p>=80?"ممتاز 👏":p>=70?"جيد جدًا":p>=60?"جيد — راجع نقاط الضعف":"تحتاج مراجعة مركزة");let h="<table><tr><th>الموضوع</th><th>النتيجة</th></tr>";for(const[k,v]of Object.entries(stats)){let z=pct(v.r,v.t);h+=`<tr><td>${k}</td><td class="${z>=70?'good':'weak'}">${v.r}/${v.t} — ${z}%</td></tr>`}h+="</table>";E("summary").innerHTML=h}
function reset(o){order=shuffle(o);pos=0;score=0;wrong=[];stats={};E("result").classList.add("hidden");E("quiz").classList.remove("hidden");render()}E("startBtn").onclick=()=>{participantName=E("nameInput").value.trim()||"Student";E("startCard").classList.add("hidden");reset([...Q.keys()])};E("retry").onclick=()=>reset([...Q.keys()]);E("review").onclick=()=>{if(wrong.length)reset([...wrong])};
function resultText(){const total=order.length,p=pct(score,total);let parts=[`PPCR Quest - ${participantName}`,`النتيجة: ${score}/${total} (${p}%)`];for(const[k,v]of Object.entries(stats)){parts.push(`${k}: ${v.r}/${v.t} (${pct(v.r,v.t)}%)`)}parts.push(`عدد الأخطاء: ${wrong.length}`);return parts.join("\n")}E("share").onclick=async()=>{const text=resultText();if(navigator.share){try{await navigator.share({title:"PPCR Quest Result",text})}catch(e){}}else{await navigator.clipboard.writeText(text);alert("تم نسخ النتيجة")}};E("whatsapp").onclick=()=>{window.open("https://wa.me/?text="+encodeURIComponent(resultText()),"_blank")};
</script></body></html>
